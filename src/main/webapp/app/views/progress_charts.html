<div class="content">
    <div style="color:#66E8FC;
                padding:15px, 50px, 5px, 50px;
                float:right;
                font-size:20px;">
        <i ng-click="progressCharts.print()" class="fa fa-print"></i>&nbsp;&nbsp;&nbsp;</div>
    <div class="row">
        <div id="progressChart" class="col-lg-10">
            <div class='row'>
                <div class="btn-group col-lg-12" >
                    <a class="btn-primary" ng-click="progressCharts.hideOthers('showDeficit')"><i class="fa fa-line-chart"></i> % Delivered</a>
                    <a class="btn-primary" ng-click="progressCharts.hideOthers('showEnergy')"><i class="fa fa-line-chart"></i> Energy</a>
                    <a class="btn-primary" ng-click="progressCharts.hideOthers('showProtein')"><i class="fa fa-line-chart"></i> Protein</a>
                    <a class="btn-primary"  ng-click="progressCharts.hideOthers('showCumulE')" ><i class="fa fa-line-chart"></i> Cumulative Energy</a>
                    <a class="btn-primary" ng-click="progressCharts.hideOthers('showCumulP')" ><i class="fa fa-line-chart"></i> Cumulative Protein</a>
                    <a class="btn-primary" ng-click="progressCharts.hideOthers('showNG')" ><i class="fa fa-line-chart"></i> NG Aspirate</a>
                </div>
            </div>
            <div class="row">
                <div class='col-lg-12'>
                    <div id="dailyDeficits" ng-show="progressCharts.showFlags.showDeficit" style="width: 100%; height: 500px;" ></div>
                    <div id="dailyEnergy" ng-show="progressCharts.showFlags.showEnergy" style="width: 100%; height: 500px;" ></div>
                    <div id="dailyProtein"  ng-show="progressCharts.showFlags.showProtein" style="width: 100%; height: 500px;" ></div>
                    <div id="cumulativeEnergy" ng-show="progressCharts.showFlags.showCumulE" style="width: 100%; height: 500px;" ></div>
                    <div id="cumulativeProtein" ng-show="progressCharts.showFlags.showCumulP" style="width: 100%; height: 500px;" ></div>
                    <div id="gastricAspirate" ng-show="progressCharts.showFlags.showNG" style="width: 100%; height: 500px;" ></div>
                </div>
            </div>
        </div>
        <div class="col-lg-2">
            <div id="previousReviewComments"></div>
        </div>
    </div>
</div>
